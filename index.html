<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tulip Bouquet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050507;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 10px;
    }
    canvas {
      max-height: 85vh;
      max-width: 95vw;
      width: auto;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 15px 50px rgba(255, 60, 110, 0.12);
      border: 1px solid #1a1a22;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #16161d;
      color: #eee;
      border: 1px solid #2e2e3a;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: #e02454;
      border-color: #ff4778;
      color: #fff;
    }
  </style>
</head>
<body>

  <canvas id="poster" width="720" height="1280"></canvas>

  <div class="controls">
    <button onclick="restartAnim()">↻ Replay</button>
    <button class="primary" id="recBtn" onclick="recordVideo()">⬇ Save Video</button>
  </div>

<script>
// ==========================================
// 🌷 CUSTOMIZE YOUR TEXT HERE
// ==========================================
const TOP_SMALL_TEXT  = "ESPECIALLY FOR YOU";
const TOP_DATE_TEXT   = "WITH ALL MY HEART";
const MAIN_TITLE      = "Tulips";
const SUBTITLE_QUOTE  = "I wish I could be there with you today, taking you to your favourite food place, bringing you a bunch of roses and lilies, and ending the day with a beautiful smile on your face. But since I couldn’t make it, I’m sending you these tulips, my BEAUTIFUL LADY. ✨🌷";
// ==========================================

const canvas = document.getElementById('poster');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const FPS = 30;
const DURATION = 7;
const TOTAL_FRAMES = FPS * DURATION;
let frame = 0;
let animId = null;

const particles = [];

function randNorm() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function addPoint(x, y, r, g, b) {
  particles.push({
    x: x, y: y,
    r: Math.min(255, Math.max(0, r)),
    g: Math.min(255, Math.max(0, g)),
    b: Math.min(255, Math.max(0, b)),
    driftX: randNorm() * 26,
    driftY: 30 + Math.random() * 45,
    startProg: 0
  });
}

function generateBouquet() {
  const colors = [
    [235, 40, 80],   // Left crimson
    [255, 115, 155], // Mid-left soft rose
    [225, 20, 60],   // Center deep ruby
    [255, 85, 130],  // Mid-right pink
    [245, 55, 95]    // Right coral red
  ];

  // Slightly raised yHead positions so the bouquet sits harmoniously above the message box
  const heads = [
    [-145, 445, -0.28, colors[0], 0.90],
    [-72,  370, -0.13, colors[1], 0.98],
    [0,    325,  0.00, colors[2], 1.12],
    [76,   380,  0.14, colors[3], 0.98],
    [148,  455,  0.28, colors[4], 0.90]
  ];

  const centerX = W / 2;
  const baseY = 865;
  const tieY = 740;

  // 1. Stems
  heads.forEach(([hxOff, hy, angle, col, scale]) => {
    const hx = centerX + hxOff;
    for (let i = 0; i < 4200; i++) {
      const t = Math.random();
      let sx = Math.pow(1 - t, 2) * (centerX - hxOff * 0.28) + 2 * (1 - t) * t * centerX + t * t * hx;
      let sy = Math.pow(1 - t, 2) * baseY + 2 * (1 - t) * t * tieY + t * t * hy;
      sx += randNorm() * 3.2;
      const shade = 0.55 + 0.45 * Math.sin(t * Math.PI) + randNorm() * 0.08;
      addPoint(sx, sy, 48 * shade, 138 * shade, 58 * shade);
    }
  });

  // 2. Sweeping Leaves
  const leaves = [
    [-165, 540, -0.45],
    [-85,  510, -0.22],
    [0,    530,  0.05],
    [92,   510,  0.24],
    [168,  550,  0.46]
  ];
  leaves.forEach(([lxTop, lyTop, angle]) => {
    for (let i = 0; i < 7500; i++) {
      const t = Math.random();
      const u = Math.random() * 2 - 1;
      const width = 30 * Math.sin(t * Math.PI) * (1 - 0.2 * t);
      let lx = Math.pow(1 - t, 2) * centerX + 2 * (1 - t) * t * (centerX + lxTop * 0.6) + t * t * (centerX + lxTop);
      let ly = Math.pow(1 - t, 2) * (tieY + 45) + 2 * (1 - t) * t * (lyTop + 85) + t * t * lyTop;
      lx += u * width * Math.cos(angle);
      ly += u * width * Math.sin(angle);
      const shade = 0.45 + 0.55 * (1 - Math.abs(u)) + 0.2 * t;
      addPoint(lx, ly, 42 * shade, 120 * shade, 52 * shade);
    }
  });

  // 3. Sculpted 3D Tulip Petals
  heads.forEach(([hxOff, hy, angle, [cr, cg, cb], scale]) => {
    const hx = centerX + hxOff;
    [-1, 1, 0].forEach(petalPos => {
      for (let i = 0; i < 7500; i++) {
        const v = Math.random();
        const u = Math.random() * 2 - 1;
        const pWidth = 42 * scale * Math.sin(v * Math.PI * 0.88);
        const pHeight = 104 * scale;

        const localX = u * pWidth + petalPos * (21 * scale * Math.sin(v * Math.PI * 0.7));
        const localY = -v * pHeight + (u * u) * (15 * scale);

        const rotA = angle + petalPos * 0.12;
        const rx = hx + localX * Math.cos(rotA) - localY * Math.sin(rotA);
        const ry = hy + localX * Math.sin(rotA) + localY * Math.cos(rotA);

        const rimLight = Math.pow(Math.abs(u), 2.4) * 52;
        const vGrad = 0.52 + 0.58 * v;
        const depth = petalPos === 0 ? 1.06 : 0.88;

        addPoint(
          rx, ry,
          cr * vGrad * depth + rimLight + randNorm() * 6,
          cg * vGrad * depth + rimLight * 0.65 + randNorm() * 6,
          cb * vGrad * depth + rimLight * 0.75 + randNorm() * 6
        );
      }
    });
  });

  let yMin = Infinity, yMax = -Infinity;
  particles.forEach(p => {
    if (p.y < yMin) yMin = p.y;
    if (p.y > yMax) yMax = p.y;
  });
  particles.forEach(p => {
    const normY = (yMax - p.y) / (yMax - yMin + 1e-5);
    p.startProg = normY * 0.70 + Math.random() * 0.09;
  });
}

// Helper to wrap and draw multi-line quote inside a styled box
function drawWrappedQuote(text, centerX, boxTopY, boxWidth, lineHeight, alpha) {
  ctx.font = 'italic 19px Georgia, "Times New Roman", serif';
  const maxTextWidth = boxWidth - 56; // 28px horizontal padding on each side
  const words = text.split(' ');
  const lines = [];
  let currentLine = '';

  for (let i = 0; i < words.length; i++) {
    const testLine = currentLine ? currentLine + ' ' + words[i] : words[i];
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxTextWidth && currentLine !== '') {
      lines.push(currentLine);
      currentLine = words[i];
    } else {
      currentLine = testLine;
    }
  }
  if (currentLine) lines.push(currentLine);

  const padY = 24;
  const boxHeight = lines.length * lineHeight + padY * 2 - 6;
  const boxX = centerX - boxWidth / 2;

  // Subtle dark glass box with soft rose border
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(boxX, boxTopY, boxWidth, boxHeight, 16);
  ctx.fillStyle = `rgba(18, 18, 26, ${0.78 * alpha})`;
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(255, 95, 135, ${0.28 * alpha})`;
  ctx.stroke();

  // Draw each wrapped line centered inside the box
  const cSub = Math.floor(218 * alpha);
  ctx.fillStyle = `rgb(${cSub}, ${cSub}, ${Math.min(255, cSub + 8)})`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], centerX, boxTopY + padY + i * lineHeight);
  }
  ctx.restore();
}

function renderFrame() {
  const prog = frame / (TOTAL_FRAMES - 1);

  const imgData = ctx.createImageData(W, H);
  const data = imgData.data;

  // Pure deep charcoal-black background (#050507)
  for (let i = 0; i < data.length; i += 4) {
    data[i] = 5;
    data[i + 1] = 5;
    data[i + 2] = 7;
    data[i + 3] = 255;
  }

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const age = (prog - p.startProg) / 0.24;
    if (age > 0) {
      const cAge = age > 1 ? 1 : age;
      const inv = 1 - cAge;
      const ease = 1 - inv * inv * inv;

      const curX = (p.x + (1 - ease) * p.driftX) | 0;
      const curY = (p.y + (1 - ease) * p.driftY) | 0;

      if (curX >= 0 && curX < W && curY >= 0 && curY < H) {
        const flash = Math.sin(cAge * Math.PI) * 70;
        const idx = (curY * W + curX) * 4;
        data[idx]     = Math.min(255, p.r * ease + flash);
        data[idx + 1] = Math.min(255, p.g * ease + flash * 0.7);
        data[idx + 2] = Math.min(255, p.b * ease + flash * 0.8);
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Typography Overlay
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  // Top Header Text
  ctx.fillStyle = '#c8cdd6';
  ctx.font = '600 18px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.letterSpacing = '4px';
  ctx.fillText(TOP_SMALL_TEXT, W / 2, 110);

  ctx.fillStyle = '#888e99';
  ctx.font = '600 14px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.letterSpacing = '3px';
  ctx.fillText(TOP_DATE_TEXT, W / 2, 142);

  // Bottom Custom Title & Boxed Message (Fades in smoothly)
  const tAlpha = Math.min(1, Math.max(0, (prog - 0.12) / 0.45));
  if (tAlpha > 0) {
    ctx.letterSpacing = '0px';
    const cMain = Math.floor(248 * tAlpha);

    ctx.fillStyle = `rgb(${cMain},${cMain},${cMain})`;
    ctx.font = 'bold 64px Georgia, "Times New Roman", serif';
    ctx.fillText(MAIN_TITLE, W / 2, 965);

    // Draw the small wrapped quote neatly inside a 610px wide box
    drawWrappedQuote(SUBTITLE_QUOTE, W / 2, 995, 610, 29, tAlpha);
  }

  if (frame < TOTAL_FRAMES - 1) {
    frame++;
    animId = requestAnimationFrame(renderFrame);
  }
}

function restartAnim() {
  if (animId) cancelAnimationFrame(animId);
  frame = 0;
  renderFrame();
}

function recordVideo() {
  const btn = document.getElementById('recBtn');
  if (typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined') {
    alert('Tip: Swipe down from the top-right of your iPad to turn on Screen Recording, then tap Replay!');
    return;
  }
  btn.textContent = '● Recording...';
  btn.disabled = true;

  const stream = canvas.captureStream(FPS);
  const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  const chunks = [];

  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = mime.includes('mp4') ? 'tulips_for_you.mp4' : 'tulips_for_you.webm';
    a.click();
    btn.textContent = '⬇ Save Video';
    btn.disabled = false;
  };

  restartAnim();
  recorder.start();
  setTimeout(() => recorder.stop(), (DURATION + 0.5) * 1000);
}

generateBouquet();
renderFrame();
</script>
</body>
</html>
